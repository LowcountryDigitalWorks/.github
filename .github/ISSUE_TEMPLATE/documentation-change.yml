name: Documentation change
description: Correct or improve repository documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Document or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is inaccurate or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
