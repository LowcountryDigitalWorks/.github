name: Validate organization workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.29.0"
  ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint" -version
          echo "ACTIONLINT_BIN=$install_dir/actionlint" >> "$GITHUB_ENV"

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflow_files < <(
            find .github/workflows workflow-templates -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )
          if (( ${#workflow_files[@]} == 0 )); then
            echo "No workflow YAML files found to validate." >&2
            exit 1
          fi
          "$ACTIONLINT_BIN" "${workflow_files[@]}"

      - name: Install verified zizmor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          install_dir="$RUNNER_TEMP/zizmor"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" "$url"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          zizmor_bin="$(find "$install_dir" -type f -name zizmor -print -quit)"
          test -n "$zizmor_bin"
          chmod +x "$zizmor_bin"
          "$zizmor_bin" --version
          echo "ZIZMOR_BIN=$zizmor_bin" >> "$GITHUB_ENV"

      - name: Audit workflow security
        shell: bash
        run: |
          set -euo pipefail
          "$ZIZMOR_BIN" --offline --strict-collection --format=plain . workflow-templates/*.yml
