name: LDW reusable secret scan

on:
  workflow_call:
    inputs:
      verify_canary:
        description: Verify the detector and Git-history scoping with runtime-only synthetic canaries before scanning.
        required: false
        type: boolean
        default: false
      use_isolated_runner:
        description: Route this invocation to the accepted LDW01 disposable/JIT security-isolated runner class.
        required: false
        type: boolean
        default: false
      scan_is_pull_request:
        description: When true on workflow_call, require scan_base_sha and scan_head_sha for pull-request history and merge-tree coverage.
        required: false
        type: boolean
        default: false
      scan_base_sha:
        description: Immutable pull-request base commit (40 hex chars) for workflow_call pull-request scans.
        required: false
        type: string
        default: ''
      scan_head_sha:
        description: Immutable pull-request head commit (40 hex chars) for workflow_call pull-request scans.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: "1.7.4"
  BETTERLEAKS_SHA256: "9ed7739a39a26a2217f38726bff8a8f4fe079d3b21272caa7959823ccc444d96"

jobs:
  secret-scan:
    runs-on: ${{ inputs.use_isolated_runner && fromJSON(format('["self-hosted","Linux","X64","ldw01","ldw-ephemeral","ldw-isolated","security-isolated","ci7-run-{0}"]', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check out caller repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          install_dir="$RUNNER_TEMP/betterleaks"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"

          # Curl retries only its built-in transient failures (408, 429, 500, 502, 503, 504, and transfer timeouts).
          # Three retries, finite connect, transfer, and retry-window limits. Checksum mismatch is not retried.
          if ! curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 45 \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$archive" \
            "$url"
          then
            rm -f "$archive"
            echo "Betterleaks pinned asset download failed after bounded transient retries." >&2
            exit 1
          fi
          if ! echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict; then
            rm -f "$archive"
            echo "Betterleaks pinned asset checksum mismatch. The archive was not extracted." >&2
            exit 1
          fi
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          betterleaks_bin="$(find "$install_dir" -type f -name betterleaks -print -quit)"
          test -n "$betterleaks_bin"
          chmod +x "$betterleaks_bin"
          "$betterleaks_bin" --version
          echo "BETTERLEAKS_BIN=$betterleaks_bin" >> "$GITHUB_ENV"

      - name: Materialize immutable trusted Betterleaks config
        shell: bash
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/ldw-trusted-betterleaks.toml"
          cat >"$cfg" <<'EOF'
          title = "LDW trusted scanner policy"
          # Workflow heredoc only. Caller configs/env cannot weaken scans.
          [extend]
          useDefault = true
          EOF
          echo "BETTERLEAKS_TRUSTED_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Enforce sanitized Betterleaks configuration environment
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'BETTERLEAKS_CONFIG='
            printf '%s\n' 'BETTERLEAKS_CONFIG_TOML='
            printf '%s\n' 'GITLEAKS_CONFIG='
            printf '%s\n' 'GITLEAKS_CONFIG_TOML='
          } >> "$GITHUB_ENV"
          echo 'Betterleaks configuration environment sanitized (fail-closed on injection).'

      - name: Install trusted empty fingerprint-ignore anchor
        shell: bash
        run: |
          set -euo pipefail
          anchor="$RUNNER_TEMP/ldw-trusted-empty.betterleaksignore"
          : >"$anchor"
          echo "BETTERLEAKS_TRUSTED_EMPTY_IGNORE=$anchor" >> "$GITHUB_ENV"

      - name: Install LDW scan trust boundary helpers (workflow-owned; never caller tree)
        shell: bash
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/ldw-scan-trust-boundary.sh"
          cat >"$helper" <<'LDW_SCAN_TRUST_BOUNDARY'
          #!/usr/bin/env bash
          set -euo pipefail

          ldw_neutralize_candidate_fingerprint_ignores() {
            local root="${1:?scan root required}"
            local name path
            for name in .betterleaksignore .gitleaksignore; do
              path="${root%/}/${name}"
              if [[ -L "$path" ]]; then
                echo 'Candidate fingerprint-ignore symlinks are refused (fail-closed).' >&2
                return 1
              fi
              if [[ -f "$path" ]]; then
                rm -f "$path"
              fi
            done
          }

          ldw_fingerprint_from_report() {
            python3 - <<'PY'
          import json
          import os
          import sys
          report_path = os.environ["LDW_FP_REPORT"]
          with open(report_path, encoding="utf-8") as handle:
              rows = json.load(handle)
          if not isinstance(rows, list) or not rows:
              sys.exit(2)
          fingerprint = rows[0].get("Fingerprint", "")
          if not fingerprint:
              sys.exit(3)
          print(fingerprint)
          PY
          }

          ldw_extract_first_fingerprint() {
            local mode="$1"
            local target="$2"
            local extra_log_opts="${3:-}"
            export LDW_FP_REPORT="$RUNNER_TEMP/ldw-fp-extract.json"
            rm -f "$LDW_FP_REPORT"
            set +e
            if [[ "$mode" == 'dir' ]]; then
              env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
                "$BETTERLEAKS_BIN" \
                --config "$BETTERLEAKS_TRUSTED_CONFIG" \
                --ignore-gitleaks-allow \
                --gitleaks-ignore-path "$BETTERLEAKS_TRUSTED_EMPTY_IGNORE" \
                dir "$target" \
                --report-format json \
                --report-path "$LDW_FP_REPORT" \
                --redact=100 \
                --no-banner \
                --log-level=error \
                >/dev/null 2>&1
            else
              env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
                "$BETTERLEAKS_BIN" \
                --config "$BETTERLEAKS_TRUSTED_CONFIG" \
                --ignore-gitleaks-allow \
                --gitleaks-ignore-path "$BETTERLEAKS_TRUSTED_EMPTY_IGNORE" \
                git "$target" \
                --log-opts="${extra_log_opts:-HEAD}" \
                --report-format json \
                --report-path "$LDW_FP_REPORT" \
                --redact=100 \
                --no-banner \
                --log-level=error \
                >/dev/null 2>&1
            fi
            set -e
            if [[ ! -s "$LDW_FP_REPORT" ]]; then
              echo 'Trusted fingerprint extraction failed (no report).' >&2
              return 1
            fi
            ldw_fingerprint_from_report
          }
          LDW_SCAN_TRUST_BOUNDARY
          chmod +x "$helper"
          echo "LDW_SCAN_TRUST_BOUNDARY=$helper" >> "$GITHUB_ENV"

      - name: Install LDW Betterleaks invocation wrapper
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/ldw-run-betterleaks"
          cat >"$wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
            "$BETTERLEAKS_BIN" \
            --config "$BETTERLEAKS_TRUSTED_CONFIG" \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$BETTERLEAKS_TRUSTED_EMPTY_IGNORE" \
            "$@"
          EOF
          chmod +x "$wrapper"
          echo "LDW_BETTERLEAKS=$wrapper" >> "$GITHUB_ENV"

      - name: Verify trusted Betterleaks configuration resolves
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          if ! env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
            "$BETTERLEAKS_BIN" config check "$BETTERLEAKS_TRUSTED_CONFIG" >/dev/null 2>&1; then
            echo 'Trusted Betterleaks config check failed.' >&2
            exit 1
          fi
          echo 'Trusted Betterleaks configuration resolved and validated.'

      - name: Verify detector with runtime-only canary
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-canary"
          mkdir -p "$canary_dir"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          printf '%s%s\n' "$prefix" "$suffix" > "$canary_dir/canary.txt"

          set +e
          "$LDW_BETTERLEAKS" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-canary.log" 2>&1
          status=$?
          set -e

          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-canary.log"

          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks canary verification failed: expected detector exit code 1, received $status." >&2
            exit 1
          fi
          echo "Betterleaks detector canary verified."

      - name: Verify caller Betterleaks config cannot weaken trusted policy
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-config-canary"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          mkdir -p "$canary_dir"
          printf '%s%s\n' "$prefix" "$suffix" >"$canary_dir/secret.txt"
          printf 'filter = "true"\n' >"$canary_dir/.betterleaks.toml"
          set +e
          "$LDW_BETTERLEAKS" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-config-canary.log" 2>&1
          status=$?
          set -e
          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-config-canary.log"
          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks config-canary failed: trusted --config must not accept caller allowlist weakening (exit $status)." >&2
            exit 1
          fi
          echo "Betterleaks trusted-config canary verified."

      - name: Verify title-only caller betterleaks.toml cannot weaken trusted policy
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-title-config-canary"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          mkdir -p "$canary_dir"
          printf '%s%s\n' "$prefix" "$suffix" >"$canary_dir/secret.txt"
          printf 'title = "candidate-config"\nfilter = "true"\n' >"$canary_dir/betterleaks.toml"
          set +e
          "$LDW_BETTERLEAKS" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-title-config-canary.log" 2>&1
          status=$?
          set -e
          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-title-config-canary.log"
          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks title-config canary failed (exit $status)." >&2
            exit 1
          fi
          echo 'Betterleaks title-only caller config canary verified.'

      - name: Verify inline allow signatures cannot suppress trusted detections
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-inline-allow-canary"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          mkdir -p "$canary_dir"
          printf '%s%s betterleaks:allow\n' "$prefix" "$suffix" >"$canary_dir/inline.txt"
          set +e
          "$LDW_BETTERLEAKS" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-inline-allow-canary.log" 2>&1
          status=$?
          set -e
          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-inline-allow-canary.log"
          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks inline-allow canary failed (exit $status)." >&2
            exit 1
          fi
          echo 'Betterleaks inline-allow signature canary verified.'

      - name: Verify BETTERLEAKS_CONFIG_TOML injection cannot weaken trusted policy
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-env-config-canary"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          mkdir -p "$canary_dir"
          printf '%s%s\n' "$prefix" "$suffix" >"$canary_dir/secret.txt"
          export BETTERLEAKS_CONFIG_TOML=$'title = "injected"\nfilter = "true"\n'
          set +e
          "$LDW_BETTERLEAKS" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-env-config-canary.log" 2>&1
          status=$?
          set -e
          unset BETTERLEAKS_CONFIG_TOML
          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-env-config-canary.log"
          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks env-config canary failed (exit $status)." >&2
            exit 1
          fi
          echo 'Betterleaks env-injection config canary verified.'

      - name: Verify candidate fingerprint-ignore files cannot suppress trusted detections
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . "$LDW_SCAN_TRUST_BOUNDARY"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          probe_log="$RUNNER_TEMP/betterleaks-fingerprint-ignore-probe.log"

          verify_dir_ignore_refused() {
            local ignore_name="$1"
            local work="$RUNNER_TEMP/fingerprint-ignore-dir-canary"
            rm -rf "$work"
            mkdir -p "$work"
            printf '%s%s\n' "$prefix" "$suffix" >"$work/surface.txt"
            local fingerprint
            fingerprint="$(ldw_extract_first_fingerprint dir "$work")"
            printf '%s\n' "$fingerprint" >"$work/${ignore_name}"
            set +e
            env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
              "$BETTERLEAKS_BIN" \
              --config "$BETTERLEAKS_TRUSTED_CONFIG" \
              --ignore-gitleaks-allow \
              dir "$work" \
              --redact=100 \
              --no-banner \
              --log-level=error \
              >"$probe_log" 2>&1
            raw_status=$?
            set -e
            if [[ "$raw_status" -ne 0 ]]; then
              echo "Fingerprint-ignore adversarial control failed for ${ignore_name} (expected suppressed scan)." >&2
              exit 1
            fi
            ldw_neutralize_candidate_fingerprint_ignores "$work"
            set +e
            "$LDW_BETTERLEAKS" dir "$work" \
              --redact=100 \
              --no-banner \
              --log-level=error \
              >"$probe_log" 2>&1
            trusted_status=$?
            set -e
            rm -rf "$work"
            if [[ "$trusted_status" -ne 1 ]]; then
              echo "Trusted dir scan must detect synthetic canary after neutralize (exit $trusted_status)." >&2
              exit 1
            fi
          }

          verify_dir_ignore_refused .gitleaksignore
          verify_dir_ignore_refused .betterleaksignore

          repo="$RUNNER_TEMP/fingerprint-ignore-git-canary"
          rm -rf "$repo"
          git init -q "$repo"
          git -C "$repo" config user.name 'LDW Fingerprint Ignore Canary'
          git -C "$repo" config user.email 'canary@example.invalid'
          printf '%s%s\n' "$prefix" "$suffix" >"$repo/tracked.txt"
          git -C "$repo" add tracked.txt
          git -C "$repo" commit -q -m 'introduce synthetic canary'
          head_sha="$(git -C "$repo" rev-parse HEAD)"
          fingerprint_git="$(ldw_extract_first_fingerprint git "$repo" "$head_sha")"
          printf '%s\n' "$fingerprint_git" >"$repo/.gitleaksignore"
          set +e
          env -u BETTERLEAKS_CONFIG -u BETTERLEAKS_CONFIG_TOML -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML \
            "$BETTERLEAKS_BIN" \
            --config "$BETTERLEAKS_TRUSTED_CONFIG" \
            --ignore-gitleaks-allow \
            git "$repo" \
            --log-opts="$head_sha" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$probe_log" 2>&1
          raw_git_status=$?
          set -e
          if [[ "$raw_git_status" -ne 0 ]]; then
            echo 'Git fingerprint-ignore adversarial control failed (expected suppressed scan).' >&2
            exit 1
          fi
          ldw_neutralize_candidate_fingerprint_ignores "$repo"
          set +e
          "$LDW_BETTERLEAKS" git "$repo" \
            --log-opts="$head_sha" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$probe_log" 2>&1
          trusted_git_status=$?
          set -e
          rm -rf "$repo"
          if [[ "$trusted_git_status" -ne 1 ]]; then
            echo "Trusted git scan must detect synthetic canary after neutralize (exit $trusted_git_status)." >&2
            exit 1
          fi

          symlink_case="$RUNNER_TEMP/fingerprint-ignore-symlink-canary"
          rm -rf "$symlink_case"
          mkdir -p "$symlink_case"
          touch "$RUNNER_TEMP/fingerprint-ignore-symlink-target"
          ln -s "$RUNNER_TEMP/fingerprint-ignore-symlink-target" "$symlink_case/.gitleaksignore"
          if ldw_neutralize_candidate_fingerprint_ignores "$symlink_case" >/dev/null 2>&1; then
            echo 'Symlinked fingerprint-ignore must fail closed.' >&2
            exit 1
          fi
          rm -rf "$symlink_case" "$RUNNER_TEMP/fingerprint-ignore-symlink-target"
          rm -f "$probe_log"
          echo 'Betterleaks fingerprint-ignore suppression canaries verified.'

      - name: Verify Git-history scope and fail-closed revision resolution
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_repo="$RUNNER_TEMP/betterleaks-scope-canary"
          safe_log="$RUNNER_TEMP/betterleaks-scope-safe.log"
          history_log="$RUNNER_TEMP/betterleaks-scope-history.log"
          merge_tree_log="$RUNNER_TEMP/betterleaks-scope-merge-tree.log"
          merge_tree="$RUNNER_TEMP/betterleaks-merge-result-tree"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'

          trap 'rm -rf "$canary_repo" "$safe_log" "$history_log" "$merge_tree_log" "$merge_tree"' EXIT
          git init -q "$canary_repo"
          git -C "$canary_repo" config user.name 'LDW Betterleaks Scope Canary'
          git -C "$canary_repo" config user.email 'canary@example.invalid'

          printf 'base\n' > "$canary_repo/base.txt"
          git -C "$canary_repo" add base.txt
          git -C "$canary_repo" commit -q -m 'base'
          base_sha="$(git -C "$canary_repo" rev-parse HEAD)"

          git -C "$canary_repo" switch -q -c unrelated
          printf '%s%s\n' "$prefix" "$suffix" > "$canary_repo/unrelated.txt"
          git -C "$canary_repo" add unrelated.txt
          git -C "$canary_repo" commit -q -m 'unrelated runtime canary'

          git -C "$canary_repo" switch -q -c candidate "$base_sha"
          printf 'candidate-safe\n' > "$canary_repo/candidate.txt"
          git -C "$canary_repo" add candidate.txt
          git -C "$canary_repo" commit -q -m 'safe candidate'
          safe_head="$(git -C "$canary_repo" rev-parse HEAD)"

          set +e
          "$LDW_BETTERLEAKS" git "$canary_repo" \
            --log-opts="${base_sha}..${safe_head} --diff-filter=tuxdb" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$safe_log" 2>&1
          safe_status=$?
          set -e
          if [[ "$safe_status" -ne 0 ]]; then
            echo 'Betterleaks scope proof failed: unrelated branch affected the safe candidate range.' >&2
            exit 1
          fi

          printf '%s%s\n' "$prefix" "$suffix" > "$canary_repo/candidate-secret.txt"
          git -C "$canary_repo" add candidate-secret.txt
          git -C "$canary_repo" commit -q -m 'candidate runtime canary introduced'
          printf 'removed\n' > "$canary_repo/candidate-secret.txt"
          git -C "$canary_repo" add candidate-secret.txt
          git -C "$canary_repo" commit -q -m 'candidate runtime canary removed'
          candidate_head="$(git -C "$canary_repo" rev-parse HEAD)"

          set +e
          "$LDW_BETTERLEAKS" git "$canary_repo" \
            --log-opts="${base_sha}..${candidate_head} --diff-filter=tuxdb" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$history_log" 2>&1
          history_status=$?
          "$LDW_BETTERLEAKS" git "$canary_repo" \
            --log-opts="$candidate_head --diff-filter=tuxdb" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$history_log" 2>&1
          push_history_status=$?
          set -e
          if [[ "$history_status" -ne 1 || "$push_history_status" -ne 1 ]]; then
            echo 'Betterleaks scope proof failed: introduced-then-removed candidate history was not detected.' >&2
            exit 1
          fi

          # Simulate a conflict-resolution canary that exists in the merge result only.
          git -C "$canary_repo" switch -q -c merge-side "$candidate_head"
          printf 'side-safe\n' > "$canary_repo/merge-result.txt"
          git -C "$canary_repo" add merge-result.txt
          git -C "$canary_repo" commit -q -m 'merge side safe value'
          side_sha="$(git -C "$canary_repo" rev-parse HEAD)"
          git -C "$canary_repo" switch -q -c merge-candidate "$candidate_head"
          printf 'candidate-safe\n' > "$canary_repo/merge-result.txt"
          git -C "$canary_repo" add merge-result.txt
          git -C "$canary_repo" commit -q -m 'candidate side safe value'
          set +e
          git -C "$canary_repo" merge --no-commit "$side_sha" >/dev/null 2>&1
          set -e
          printf '%s%s\n' "$prefix" "$suffix" > "$canary_repo/merge-result.txt"
          git -C "$canary_repo" add merge-result.txt
          git -C "$canary_repo" commit -q -m 'synthetic conflict resolution result'
          if git -C "$canary_repo" show "$candidate_head:merge-result.txt" >/dev/null 2>&1; then
            echo 'Betterleaks merge-result proof setup failed: canary path already existed at the exact PR head.' >&2
            exit 1
          fi
          mkdir -p "$merge_tree"
          canary_head="$(git -C "$canary_repo" rev-parse HEAD)"
          merge_result_tree="$(git -C "$canary_repo" merge-tree --write-tree "$base_sha" "$canary_head")"
          merge_index="$RUNNER_TEMP/betterleaks-scope-merge.idx"
          GIT_INDEX_FILE="$merge_index" git -C "$canary_repo" read-tree "$merge_result_tree"
          GIT_INDEX_FILE="$merge_index" git -C "$canary_repo" checkout-index -a -f --prefix="${merge_tree}/"
          rm -f "$merge_index"

          set +e
          "$LDW_BETTERLEAKS" dir "$merge_tree" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$merge_tree_log" 2>&1
          merge_tree_status=$?
          set -e
          if [[ "$merge_tree_status" -ne 1 ]]; then
            echo 'Betterleaks current-tree proof failed: synthetic merge-result canary was not detected.' >&2
            exit 1
          fi
          echo 'Betterleaks scope, resolver, and merge-result proofs passed; canary findings were suppressed.'

      - name: Install trusted scan mode binder (workflow-owned; never caller tree)
        shell: bash
        run: |
          set -euo pipefail
          binder="$RUNNER_TEMP/ldw-bind-scan-mode.sh"
          cat >"$binder" <<'LDW_BIND_SCAN_MODE_TRUSTED'
          #!/usr/bin/env bash
          # Trusted workflow materialization only — not sourced from caller checkout.
          set -euo pipefail

          ldw_bind_scan_mode() {
            local event_name="$1"
            local wf_scan_is_pr="$2"
            local wf_scan_base_sha="${3:-}"
            local wf_scan_head_sha="${4:-}"

            if [[ "$event_name" == 'pull_request_target' ]]; then
              echo 'pull_request_target is explicitly refused for the LDW reusable secret scanner.' >&2
              return 1
            fi
            if [[ "$event_name" == 'workflow_run' ]]; then
              echo 'workflow_run is unsupported for mandatory secret scan invocation; failing closed.' >&2
              return 1
            fi

            case "$event_name" in
              pull_request)
                printf '%s\n' 'SCAN_MODE=pull_request'
                ;;
              push|workflow_dispatch)
                printf '%s\n' 'SCAN_MODE=single_sha'
                ;;
              workflow_call)
                if [[ "$wf_scan_is_pr" == 'true' ]]; then
                  if [[ ! "$wf_scan_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$wf_scan_head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
                    echo 'workflow_call pull-request scan requires exact base/head SHAs; failing closed.' >&2
                    return 1
                  fi
                  printf '%s\n' 'SCAN_MODE=pull_request'
                  printf 'SCAN_BASE_SHA=%s\n' "$wf_scan_base_sha"
                  printf 'SCAN_HEAD_SHA=%s\n' "$wf_scan_head_sha"
                else
                  printf '%s\n' 'SCAN_MODE=single_sha'
                fi
                ;;
              *)
                echo "Unsupported github.event_name for secret scan: ${event_name}" >&2
                return 1
                ;;
            esac
          }

          run_selftest() {
            local base='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            local head='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
            local err out

            expect_fail() {
              err="$(mktemp)"
              if ldw_bind_scan_mode "$@" >"$(mktemp)" 2>"$err"; then
                rm -f "$err"
                echo "selftest expected failure for: $*" >&2
                exit 1
              fi
              rm -f "$err"
            }

            expect_ok_contains() {
              local needle="$1"
              shift
              err="$(mktemp)"
              out="$(mktemp)"
              if ! ldw_bind_scan_mode "$@" >"$out" 2>"$err"; then
                rm -f "$err" "$out"
                echo "selftest expected success for: $*" >&2
                exit 1
              fi
              if ! grep -q "$needle" <"$out"; then
                rm -f "$err" "$out"
                echo "selftest missing ${needle} for: $*" >&2
                exit 1
              fi
              rm -f "$err" "$out"
            }

            expect_fail workflow_run false '' ''
            expect_fail workflow_run true "$base" "$head"
            expect_fail schedule false '' ''
            expect_fail repository_dispatch false '' ''
            expect_fail pull_request_target false '' ''
            expect_fail workflow_call true '' "$head"
            expect_fail workflow_call true 'not-a-sha' "$head"
            expect_fail workflow_call true "$base" ''

            expect_ok_contains 'SCAN_MODE=pull_request' pull_request false '' ''
            expect_ok_contains 'SCAN_MODE=single_sha' push false '' ''
            expect_ok_contains 'SCAN_MODE=single_sha' workflow_dispatch false '' ''
            expect_ok_contains 'SCAN_MODE=single_sha' workflow_call false '' ''
            expect_ok_contains 'SCAN_MODE=pull_request' workflow_call true "$base" "$head"
            expect_ok_contains "SCAN_BASE_SHA=${base}" workflow_call true "$base" "$head"

            echo 'bind_scan_mode_logic_selftest=PASS'
          }

          if [[ "${1:-}" == 'selftest' ]]; then
            run_selftest
          elif [[ "${1:-}" == 'bind' ]]; then
            shift
            ldw_bind_scan_mode "$@"
          fi
          LDW_BIND_SCAN_MODE_TRUSTED
          chmod +x "$binder"
          echo "LDW_BIND_SCAN_MODE=$binder" >> "$GITHUB_ENV"

      - name: Verify scan mode binding refuses workflow_run and unknown events
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          "$LDW_BIND_SCAN_MODE" selftest

      - name: Bind caller-authoritative scan mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_SCAN_IS_PR: ${{ inputs.scan_is_pull_request }}
          WF_SCAN_BASE_SHA: ${{ inputs.scan_base_sha }}
          WF_SCAN_HEAD_SHA: ${{ inputs.scan_head_sha }}
        run: |
          set -euo pipefail
          bind_out="$(mktemp)"
          if ! "$LDW_BIND_SCAN_MODE" bind "$EVENT_NAME" "$WF_SCAN_IS_PR" "$WF_SCAN_BASE_SHA" "$WF_SCAN_HEAD_SHA" >"$bind_out"; then
            rm -f "$bind_out"
            exit 1
          fi
          cat "$bind_out" >> "$GITHUB_ENV"
          rm -f "$bind_out"
          echo 'Caller scan mode bound without executing candidate code.'

      - name: Resolve caller-authoritative Git scan scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_MODE: ${{ env.SCAN_MODE }}
          SCAN_BASE_SHA: ${{ env.SCAN_BASE_SHA }}
          SCAN_HEAD_SHA: ${{ env.SCAN_HEAD_SHA }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CALLER_SHA: ${{ github.sha }}
          VERIFY_CANARY: ${{ inputs.verify_canary }}
        run: |
          set -euo pipefail

          is_available_commit() {
            local revision="$1"
            [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]] && git cat-file -e "${revision}^{commit}" 2>/dev/null
          }

          resolve_scope() {
            local event_name="$1"
            local scan_mode="$2"
            local pr_base_sha="$3"
            local pr_head_sha="$4"
            local caller_sha="$5"

            if [[ "$scan_mode" == 'pull_request' ]]; then
              if ! is_available_commit "$pr_base_sha" || ! is_available_commit "$pr_head_sha"; then
                echo 'Secret scan cannot resolve pull-request base/head SHAs; failing closed.' >&2
                return 1
              fi
              printf '%s..%s --diff-filter=tuxdb\n' "$pr_base_sha" "$pr_head_sha"
              return 0
            fi

            case "$event_name" in
              pull_request)
                if ! is_available_commit "$pr_base_sha" || ! is_available_commit "$pr_head_sha"; then
                  echo 'Secret scan cannot resolve pull-request base/head SHAs; failing closed.' >&2
                  return 1
                fi
                printf '%s..%s --diff-filter=tuxdb\n' "$pr_base_sha" "$pr_head_sha"
                ;;
              *)
                if ! is_available_commit "$caller_sha"; then
                  echo 'Secret scan cannot resolve caller SHA; failing closed.' >&2
                  return 1
                fi
                printf '%s --diff-filter=tuxdb\n' "$caller_sha"
                ;;
            esac
          }

          if [[ "$VERIFY_CANARY" == 'true' ]]; then
            resolver_repo="$RUNNER_TEMP/betterleaks-resolver-canary"
            trap 'rm -rf "$resolver_repo"' EXIT
            git init -q "$resolver_repo"
            git -C "$resolver_repo" config user.name 'LDW Resolver Canary'
            git -C "$resolver_repo" config user.email 'canary@example.invalid'
            printf 'safe\n' > "$resolver_repo/base.txt"
            git -C "$resolver_repo" add base.txt
            git -C "$resolver_repo" commit -q -m 'resolver base'
            resolver_base="$(git -C "$resolver_repo" rev-parse HEAD)"
            printf 'safe candidate\n' > "$resolver_repo/candidate.txt"
            git -C "$resolver_repo" add candidate.txt
            git -C "$resolver_repo" commit -q -m 'resolver candidate'
            resolver_head="$(git -C "$resolver_repo" rev-parse HEAD)"

            expected_pr_opts="${resolver_base}..${resolver_head} --diff-filter=tuxdb"
            expected_push_opts="${resolver_head} --diff-filter=tuxdb"
            [[ "$(cd "$resolver_repo" && resolve_scope pull_request pull_request "$resolver_base" "$resolver_head" '')" == "$expected_pr_opts" ]]
            [[ "$(cd "$resolver_repo" && resolve_scope push single_sha '' '' "$resolver_head")" == "$expected_push_opts" ]]

            expect_scope_failure() {
              if (cd "$resolver_repo" && resolve_scope "$@") >/dev/null 2>&1; then
                echo 'Secret-scan revision resolver unexpectedly accepted an invalid revision.' >&2
                exit 1
              fi
            }
            expect_scope_failure pull_request pull_request '' "$resolver_head" ''
            expect_scope_failure pull_request pull_request 'not-a-sha' "$resolver_head" ''
            expect_scope_failure pull_request pull_request '0000000000000000000000000000000000000000' "$resolver_head" ''
            expect_scope_failure pull_request pull_request 'main' "$resolver_head" ''
            expect_scope_failure pull_request pull_request "$resolver_base" '' ''
            expect_scope_failure push single_sha '' '' ''
            expect_scope_failure push single_sha '' '' 'not-a-sha'
            expect_scope_failure push single_sha '' '' '0000000000000000000000000000000000000000'
            echo 'Secret-scan revision resolver passed valid and fail-closed canaries.'
          fi

          effective_base="$PR_BASE_SHA"
          effective_head="$PR_HEAD_SHA"
          if [[ "$SCAN_MODE" == 'pull_request' && -n "${SCAN_BASE_SHA:-}" && -n "${SCAN_HEAD_SHA:-}" ]]; then
            effective_base="$SCAN_BASE_SHA"
            effective_head="$SCAN_HEAD_SHA"
          fi
          log_opts="$(resolve_scope "$EVENT_NAME" "$SCAN_MODE" "$effective_base" "$effective_head" "$CALLER_SHA")"
          printf 'BETTERLEAKS_LOG_OPTS=%s\n' "$log_opts" >> "$GITHUB_ENV"
          echo 'Betterleaks scope resolved to exact caller SHA(s) with the v1.7.4 diff filter.'

      - name: Scan caller-authoritative Git history without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          scan_log="$RUNNER_TEMP/betterleaks-scan.log"
          # shellcheck source=/dev/null
          . "$LDW_SCAN_TRUST_BOUNDARY"
          ldw_neutralize_candidate_fingerprint_ignores .

          set +e
          "$LDW_BETTERLEAKS" git . \
            --log-opts="$BETTERLEAKS_LOG_OPTS" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$scan_log" 2>&1
          status=$?
          set -e

          rm -f "$scan_log"

          case "$status" in
            0)
              echo "Betterleaks caller-authoritative history scan passed."
              ;;
            1)
              echo "Betterleaks detected one or more potential secrets in the caller-authoritative history scope. Finding contents are intentionally suppressed from CI logs." >&2
              exit 1
              ;;
            *)
              echo "Betterleaks scan failed with scanner exit code $status. Scanner output is intentionally suppressed from CI logs." >&2
              exit "$status"
              ;;
          esac

      - name: Scan caller candidate tree for merge/reconciliation results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_MODE: ${{ env.SCAN_MODE }}
          SCAN_BASE_SHA: ${{ env.SCAN_BASE_SHA }}
          SCAN_HEAD_SHA: ${{ env.SCAN_HEAD_SHA }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          scan_log="$RUNNER_TEMP/betterleaks-tree-scan.log"
          merge_result_log="$RUNNER_TEMP/betterleaks-merge-result.log"
          merge_tree_dir="$RUNNER_TEMP/betterleaks-pr-merge-tree"
          scan_dir='.'
          trap 'rm -f "$scan_log" "$merge_result_log"; rm -rf "$merge_tree_dir"' EXIT

          merge_base="$PR_BASE_SHA"
          merge_head="$PR_HEAD_SHA"
          if [[ -n "${SCAN_BASE_SHA:-}" && -n "${SCAN_HEAD_SHA:-}" ]]; then
            merge_base="$SCAN_BASE_SHA"
            merge_head="$SCAN_HEAD_SHA"
          fi
          use_merge_tree='false'
          if [[ "$SCAN_MODE" == 'pull_request' || "$EVENT_NAME" == 'pull_request' ]]; then
            use_merge_tree='true'
          fi
          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            echo 'pull_request_target merge-tree scan is explicitly refused; failing closed.' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            echo 'workflow_run merge-tree scan is unsupported; failing closed.' >&2
            exit 1
          fi

          if [[ "$use_merge_tree" == 'true' ]]; then
            if [[ ! "$merge_base" =~ ^[0-9a-fA-F]{40}$ || ! "$merge_head" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'Secret scan merge-tree requires exact pull-request base/head SHAs; failing closed.' >&2
              exit 1
            fi
            if ! git cat-file -e "${merge_base}^{commit}" 2>/dev/null || ! git cat-file -e "${merge_head}^{commit}" 2>/dev/null; then
              echo 'Secret scan merge-tree requires resolvable base/head commit objects; failing closed.' >&2
              exit 1
            fi
            if ! git merge-tree --write-tree "$merge_base" "$merge_head" >"$merge_result_log" 2>&1; then
              rm -f "$merge_result_log"
              echo 'Secret scan could not resolve the pull-request candidate tree; failing closed.' >&2
              exit 1
            fi
            merge_tree_sha="$(head -n 1 "$merge_result_log")"
            rm -f "$merge_result_log"
            if ! git cat-file -e "${merge_tree_sha}^{tree}" 2>/dev/null; then
              echo 'Secret scan merge-tree returned an invalid tree object; failing closed.' >&2
              exit 1
            fi
            merge_index="$RUNNER_TEMP/ldw-pr-merge-tree.idx"
            mkdir -p "$merge_tree_dir"
            GIT_INDEX_FILE="$merge_index" git read-tree "$merge_tree_sha"
            GIT_INDEX_FILE="$merge_index" git checkout-index -a -f --prefix="${merge_tree_dir}/"
            rm -f "$merge_index"
            scan_dir="$merge_tree_dir"
          fi

          # shellcheck source=/dev/null
          . "$LDW_SCAN_TRUST_BOUNDARY"
          ldw_neutralize_candidate_fingerprint_ignores "$scan_dir"

          set +e
          "$LDW_BETTERLEAKS" dir "$scan_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$scan_log" 2>&1
          status=$?
          set -e

          rm -f "$scan_log" "$merge_result_log"
          rm -rf "$merge_tree_dir"
          case "$status" in
            0)
              echo 'Betterleaks caller candidate-tree scan passed.'
              ;;
            1)
              echo 'Betterleaks detected one or more potential secrets in the caller candidate tree. Finding contents are intentionally suppressed in CI logs.' >&2
              exit 1
              ;;
            *)
              echo "Betterleaks candidate-tree scan failed with scanner exit code $status. Scanner output intentionally suppressed in CI logs." >&2
              exit "$status"
              ;;
          esac
