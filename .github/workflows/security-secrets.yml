name: LDW reusable secret scan

on:
  workflow_call:
    inputs:
      verify_canary:
        description: Verify the detector with a runtime-only synthetic canary before scanning.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: "1.7.4"
  BETTERLEAKS_SHA256: "9ed7739a39a26a2217f38726bff8a8f4fe079d3b21272caa7959823ccc444d96"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          install_dir="$RUNNER_TEMP/betterleaks"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" "$url"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          betterleaks_bin="$(find "$install_dir" -type f -name betterleaks -print -quit)"
          test -n "$betterleaks_bin"
          chmod +x "$betterleaks_bin"
          "$betterleaks_bin" --version
          echo "BETTERLEAKS_BIN=$betterleaks_bin" >> "$GITHUB_ENV"

      - name: Verify detector with runtime-only canary
        if: ${{ inputs.verify_canary }}
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/betterleaks-canary"
          mkdir -p "$canary_dir"
          prefix='ghp_'
          suffix='A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
          printf '%s%s\n' "$prefix" "$suffix" > "$canary_dir/canary.txt"

          set +e
          "$BETTERLEAKS_BIN" dir "$canary_dir" \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$RUNNER_TEMP/betterleaks-canary.log" 2>&1
          status=$?
          set -e

          rm -rf "$canary_dir" "$RUNNER_TEMP/betterleaks-canary.log"

          if [[ "$status" -ne 1 ]]; then
            echo "Betterleaks canary verification failed: expected detector exit code 1, received $status." >&2
            exit 1
          fi
          echo "Betterleaks detector canary verified."

      - name: Scan repository history without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          scan_log="$RUNNER_TEMP/betterleaks-scan.log"

          set +e
          "$BETTERLEAKS_BIN" git . \
            --redact=100 \
            --no-banner \
            --log-level=error \
            >"$scan_log" 2>&1
          status=$?
          set -e

          rm -f "$scan_log"

          case "$status" in
            0)
              echo "Betterleaks repository-history scan passed."
              ;;
            1)
              echo "Betterleaks detected one or more potential secrets. Finding contents are intentionally suppressed from CI logs." >&2
              exit 1
              ;;
            *)
              echo "Betterleaks scan failed with scanner exit code $status. Scanner output is intentionally suppressed from CI logs." >&2
              exit "$status"
              ;;
          esac
