name: Prove dependency scanning

on:
  pull_request:
    paths:
      - .github/workflows/security-dependencies-npm.yml
      - .github/workflows/prove-dependency-scanning.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/security-dependencies-npm.yml
      - .github/workflows/prove-dependency-scanning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan-proof:
    uses: ./.github/workflows/security-dependencies-npm.yml
    with:
      online_queries: true
      verify_canary: true
