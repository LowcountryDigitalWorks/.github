name: Secret pattern check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked text files
        shell: bash
        run: |
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pour]_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9._-]{36,}|github_pat_[A-Za-z0-9_]{20,})' -- .             ':(exclude)*.lock' ':(exclude)*.svg'; then
            echo "Potential secret pattern found."
            exit 1
          fi
